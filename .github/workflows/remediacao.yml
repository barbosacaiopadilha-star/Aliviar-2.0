# CI mínimo da remediação (Bloco G1 / ETAPA 8 — achado TST-04).
#
# Dois jobs, por desenho:
#  - `estaveis`   — obrigatoriamente VERDE: infraestrutura, meta-testes,
#                   integração existente, build verificado, smoke do porteiro.
#  - `gates`      — a suíte de remediação (tests/remediacao). VERMELHA por
#                   desenho até os Blocos B/C/D corrigirem os defeitos que
#                   ela reproduz. O job é obrigatório de propósito: o branch
#                   não finge estar pronto para merge enquanto houver gate
#                   aberto (regra do RELEASE_CHARTER/G1).
#
# Nunca usa credenciais de produção: a stack é o Supabase local efêmero do
# runner (supabase start), com as guardas anti-remoto do repositório ativas.
#
# LIMITAÇÃO REGISTRADA (G1): este workflow não pôde ser executado ainda —
# ativá-lo exige push, proibido até autorização própria. A validação ocorrerá
# no primeiro push autorizado do branch de remediação.
name: remediacao

on:
  pull_request:
  push:
    branches: [main, "remediacao/**"]

concurrency:
  group: remediacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estaveis:
    name: gates estáveis (devem passar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalação reproduzível
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local efêmero (aplica as migrations do ledger)
        run: supabase start
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (via injetor — next.config.ts exige o alvo do Supabase)
        run: node scripts/with-local-supabase.mjs npx next lint
      - name: Unitários + meta-testes arquiteturais
        run: node scripts/with-local-supabase.mjs vitest run
      - name: Componentes
        run: npm run test:components
      - name: Verificação das migrations (ledger)
        run: npm run supabase:ledger:check
      - name: Integração (suíte completa — herança reincorporada no Bloco E)
        run: >
          node scripts/with-local-supabase.mjs npx vitest run
          --config vitest.integration.config.ts
      - name: Paridade do Catálogo (fonte única — ADR-046/047)
        # O gate de paridade roda TAMBÉM no job estável, por mandato do Bloco
        # E: a paridade banco × catálogo gerado é pré-condição de qualquer
        # verde, não um gate de remediação pendente.
        run: >
          node scripts/with-local-supabase.mjs npx vitest run
          --config vitest.remediacao.config.ts
          tests/remediacao/paridade-catalogo.integration.test.ts
      - name: Build local íntegro (sem stop-stale — não há servidor prévio em CI)
        run: |
          node scripts/clean-next-output.mjs
          node scripts/new-build-id.mjs
          node scripts/with-local-supabase.mjs npx next build
          node scripts/verify-build-id.mjs
      - name: Backend único no bundle
        run: npm run verify:backend:local
      - name: Playwright (chromium)
        run: npx playwright install chromium --with-deps
      - name: Smoke E2E — porteiro de ambiente
        run: node scripts/with-local-supabase.mjs npx playwright test --project=porteiro-ambiente

  gates:
    name: gates de remediação (vermelhos até B/C/D)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Suíte de remediação (tests/remediacao)
        run: npm run test:remediacao
